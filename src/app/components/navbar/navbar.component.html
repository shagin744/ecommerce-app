
<nav class="bg-[#131921] text-white px-4 py-2 flex items-center justify-between">
  <div class="flex items-center space-x-2 cursor-pointer" (click)="goHome()">
    <span class="text-2xl font-bold text-orange-400">MyShop</span>
  </div>

  <div class="flex flex-1 mx-6">
    <input
      type="text"
      placeholder="Search products..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="submitSearch()"
      class="w-full px-4 py-2 text-black rounded-l-md outline-none"
    />
    <button
      type="button"
      (click)="submitSearch()"
      class="bg-yellow-400 px-4 rounded-r-md">
      Search
    </button>
  </div>

  <div class="flex items-center space-x-6 text-sm">
    <div routerLink="/account" class="cursor-pointer">
      <p class="text-xs">Hello, User</p>
      <p class="font-bold">Account</p> 
    </div>

    <div routerLink="/orders" class="cursor-pointer">
      <p class="text-xs">Returns</p>
      <p class="font-bold">& Orders</p>
    </div>

    <div routerLink="/cart" class="cursor-pointer flex items-center">
      <span class="font-bold">Cart</span>
    </div>
  </div>
</nav>


<div class="bg-[#232F3E] text-white px-4 py-2 flex flex-wrap gap-4 text-sm">
  <button
    *ngFor="let category of categories"
    type="button"
    (click)="selectCategory(category.key)"
    class="cursor-pointer rounded px-2 py-1 transition hover:bg-white/10"
    [ngClass]="{
      'bg-white/15 font-semibold': activeCategory === category.key
    }">
    {{ category.label }}
  </button>
</div>
