<div class="bg-white p-4 rounded-lg shadow hover:shadow-lg transition duration-300">

  
  <div class="h-48 flex justify-center items-center">
    <img [src]="product.image" class="h-full object-contain" alt="" />
  </div>

  
  <h2 class="text-sm font-semibold mt-3 line-clamp-2">
    {{ product.title }}
  </h2>

  
  <div class="flex items-center mt-1 text-yellow-500 text-sm">
    ★★★★☆ <span class="text-gray-500 ml-2">(120)</span>
  </div>

  <!-- Price -->
  <p class="text-lg font-bold mt-1">
    ₹ {{ product.price }}
  </p>

  
  <p class="text-xs text-gray-500">
    FREE Delivery
  </p>

  
  <div class="mt-3 space-y-2">

    <button
      (click)="addToCart()"
      class="w-full bg-yellow-400 hover:bg-yellow-500 py-1 rounded">
      Add to Cart
    </button>

    <a
      [routerLink]="['/product', product.id]"
      class="block text-center bg-orange-500 hover:bg-orange-600 text-white py-1 rounded">
      Buy Now
    </a>

  </div>

</div>
